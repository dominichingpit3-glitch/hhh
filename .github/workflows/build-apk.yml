name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Audit & Prepare Environment
        run: |
          # 1. Detect if project files are inside 'hhh-main' or repository root
          if [ -d "hhh-main" ]; then
            echo "PROJECT_DIR=hhh-main" >> $GITHUB_ENV
            CD_DIR="hhh-main"
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            CD_DIR="."
          fi
          
          cd $CD_DIR

          # 2. Generate Gradle Wrapper if missing from resource list
          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper missing. Generating wrapper..."
            gradle wrapper
          fi

          # 3. Ensure executable permissions
          chmod +x gradlew

          # 4. Create dummy local.properties if needed
          if [ ! -f "local.properties" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          fi

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
