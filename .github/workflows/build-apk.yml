name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Audit & Prepare Project Structure
        run: |
          # Detect root directory vs hhh-main subfolder
          if [ -d "hhh-main" ]; then
            echo "PROJECT_DIR=hhh-main" >> $GITHUB_ENV
            TARGET_DIR="hhh-main"
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            TARGET_DIR="."
          fi

          cd $TARGET_DIR

          # Fix Missing Gradle Wrapper
          if [ ! -f "gradlew" ]; then
            echo "Generating missing Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

          # Fix Missing local.properties
          if [ ! -f "local.properties" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          fi

          # Fix Missing google-services.json (Prevents Google Services Plugin error)
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating dummy google-services.json..."
            mkdir -p app
            echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example.app"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

          # Fix Missing debug.keystore (Prevents validateSigningDebug task crash)
          if [ ! -f "debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
